name: zizmor

permissions: {}

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Lint actions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Install only zizmor (not the full mise.toml — this job has no need
      # for node). Version + checksums come from mise.toml / mise.lock,
      # keeping CI and `mise run lint-actions` on the same binary.
      - name: Install zizmor via mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          version: '2026.5.12'
          install_args: 'aqua:zizmorcore/zizmor'

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise exec -- zizmor --format=github --min-severity=medium .
